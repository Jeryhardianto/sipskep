server {
    listen 80;
    root /var/www/html;
    index index.php;

    # sama seperti app/.htaccess: tolak akses langsung
    location ^~ /app/ { deny all; }
    location ^~ /vendor/ { deny all; }
    location = /sipskep.sql { deny all; }

    location / {
        try_files $uri $uri/ @router;
    }

    # pengganti RewriteRule ^(.*)$ index.php?url=$1
    location @router {
        rewrite ^/(.*)$ /index.php?url=$1&$args last;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
