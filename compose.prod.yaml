# Produksi di vm-gpu. Pola: dev-ops/home-server/traefik.md bagian 4.
# Tanpa port yang dipublikasikan — trafik masuk lewat tunnel vm-gpu ke Traefik
# di network `edge`. Jalankan selalu dengan --env-file .env.prod.
services:
  web:
    image: nginx:alpine
    container_name: sipskep
    restart: unless-stopped
    networks: [default, edge]
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      traefik.enable: "true"
      # Container ini duduk di dua network — beri tahu Traefik yang mana.
      traefik.docker.network: edge
      traefik.http.routers.sipskep.rule: Host(`sipskep.blataktech.com`)
      traefik.http.services.sipskep.loadbalancer.server.port: "80"
      traefik.http.routers.sipskep.middlewares: sec@docker,gzip@docker
    depends_on: [php]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  php:
    build: .
    image: sipskep-php:latest
    container_name: sipskep-php
    restart: unless-stopped
    # Sengaja hanya di `default`: PHP-FPM tidak berurusan dengan Traefik.
    networks: [default]
    environment:
      BASEURL: ${BASEURL}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    # Read-only: aplikasi tidak pernah menulis ke direktorinya sendiri.
    volumes:
      - .:/var/www/html:ro
      - ./docker/php-prod.ini:/usr/local/etc/php/conf.d/zz-prod.ini:ro
    depends_on:
      db:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # mariadb:11 sudah ada di vm-gpu — tag ini menghindari pull ~330MB lagi.
    image: mariadb:11
    container_name: sipskep-db
    restart: unless-stopped
    networks: [default]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      # Seed hanya jalan saat volume db-data masih kosong.
      - ./sipskep.sql:/docker-entrypoint-initdb.d/sipskep.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:

networks:
  default:
    driver: bridge
  # Dimiliki stack Traefik (/opt/traefik) — jangan pernah dibuat dari sini.
  edge:
    external: true
